services:
  postgres:
    image: postgres:16
    container_name: bigblue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: bigblue_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  nginx:
    image: nginx:alpine
    container_name: bigblue_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

  coturn:
    image: coturn/coturn
    container_name: bigblue_coturn
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --external-ip=192.168.1.185
      --realm=bigblue.local
      --user=${TURN_USER}:${TURN_PASSWORD}
      --lt-cred-mech
      --min-port=49152
      --max-port=49252

volumes:
  postgres_data:
  minio_data:
